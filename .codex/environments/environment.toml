[setup.win32]
script = '''
$ErrorActionPreference = 'Stop'
if (-not $env:CODEX_WORKTREE_PATH) { throw 'CODEX_WORKTREE_PATH not set' }
Set-Location -LiteralPath $env:CODEX_WORKTREE_PATH
fnm env --use-on-cd --shell powershell | Out-String | Invoke-Expression
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
