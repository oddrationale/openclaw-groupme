name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test_matrix:
    name: test (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Coverage
        if: matrix.node-version == 24
        run: npm run test:coverage

      - name: Check npm package contents
        run: npm pack --dry-run

  test:
    runs-on: ubuntu-latest
    needs: test_matrix
    if: always()

    steps:
      - name: Require successful matrix
        run: |
          if [ "${{ needs.test_matrix.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test_matrix.result }}"
            exit 1
          fi
