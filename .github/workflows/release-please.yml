name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Show package version
        run: npm pkg get name version

      # Pack and validate the ClawHub publish (the weakest link) BEFORE the
      # irreversible npm publish. npm rejects re-publishing an existing version,
      # so if ClawHub fails after npm succeeds the release is stuck. By packing
      # and dry-running ClawHub first, a ClawHub-side problem fails the job
      # before anything is published, leaving the release safe to re-run.
      - name: Pack package for ClawHub
        id: pack
        run: |
          # Build explicitly, then pack with --ignore-scripts so lifecycle
          # output (e.g. `prepare`/lefthook writing to stdout) cannot pollute
          # the JSON we parse for the tarball filename.
          npm run build
          npm pack --json --ignore-scripts > pack-result.json
          TARBALL="$(
            node -e "const fs = require('node:fs'); const packed = JSON.parse(fs.readFileSync('pack-result.json', 'utf8')); const filename = packed[0]?.filename; if (!filename) { console.error('npm pack did not report a tarball filename.'); process.exit(1); } process.stdout.write(filename);"
          )"
          if [ -z "${TARBALL}" ] || [ ! -f "${TARBALL}" ]; then
            echo "::error::npm pack did not produce a readable tarball."
            exit 1
          fi
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"

      - name: Validate ClawHub publish (dry run)
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "${CLAWHUB_TOKEN:-}" ]; then
            echo "::error::CLAWHUB_TOKEN secret is required to publish to ClawHub."
            exit 1
          fi
          npx --yes clawhub@0.19.1 login --token "${CLAWHUB_TOKEN}"
          npx --yes clawhub@0.19.1 package publish "${{ steps.pack.outputs.tarball }}" \
            --family code-plugin \
            --source-repo "${GITHUB_REPOSITORY}" \
            --source-commit "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --manual-override-reason "GitHub Actions release publish via CLAWHUB_TOKEN" \
            --dry-run

      - name: Publish package to npm
        run: npm publish --provenance --access public

      - name: Publish package to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          npx --yes clawhub@0.19.1 login --token "${CLAWHUB_TOKEN}"
          npx --yes clawhub@0.19.1 package publish "${{ steps.pack.outputs.tarball }}" \
            --family code-plugin \
            --source-repo "${GITHUB_REPOSITORY}" \
            --source-commit "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --manual-override-reason "GitHub Actions release publish via CLAWHUB_TOKEN"
