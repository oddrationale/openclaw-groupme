pre-commit:
  commands:
    biome:
      glob: "*.{ts,js,json,jsonc,md,yml,yaml}"
      run: npx biome check --write --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    check:
      run: npm run check
