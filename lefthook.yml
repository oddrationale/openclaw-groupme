pre-commit:
  commands:
    oxlint:
      glob: "*.{ts,js,mjs,cjs}"
      run: npx oxlint --type-aware --fix {staged_files}
      stage_fixed: true
    oxfmt:
      glob: "*.{ts,js,mjs,cjs,jsonc,md,yml,yaml}"
      run: npx oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    check:
      run: npm run check
